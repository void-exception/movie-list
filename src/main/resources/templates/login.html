<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; }
        .card { max-width: 380px; margin: 80px auto; background: #fff; padding: 28px; border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0,0,0,.08); }
        h1 { margin: 0 0 16px; font-size: 22px; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 9px; box-sizing: border-box; margin-top: 4px;
            border: 1px solid #c9d2dc; border-radius: 4px; }
        button { margin-top: 18px; padding: 11px; width: 100%; background: #2563eb; color: #fff;
            border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
        button:hover { background: #1d4ed8; }
        .error { color: #dc2626; margin-top: 12px; }
        a { color: #2563eb; }
        p { font-size: 14px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Вход</h1>
    <form method="post" action="/login">
        <label>Логин</label>
        <input type="text" name="login" required autofocus>
        <label>Пароль</label>
        <input type="password" name="password" required>
        <button type="submit">Войти</button>
    </form>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p>Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</div>
</body>
</html>
